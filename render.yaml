services:
  - type: web
    name: avenir-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-portal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://avenir.app,https://www.avenir.app,http://localhost:5173,http://127.0.0.1:5173"

databases:
  - name: avenir-db
    plan: free
